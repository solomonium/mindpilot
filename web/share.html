<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:site_name" content="MindPilot">
    <meta property="og:title" content="MindPilot">
    <meta property="og:description" content="Organize your thoughts, stay focused, and achieve your goals. Think clearly, live intentionally.">
    <!-- Points to the highly optimized, lightweight preview.png hosted on your domain -->

    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta property="og:url" content="https://mindpilot-131f1.web.app/share">

    <!-- Twitter Preview Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="MindPilot">
    <meta name="twitter:description" content="Think clearly, live intentionally.">
    <meta name="twitter:image" content="https://mindpilot-131f1.web.app/preview.png">
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Responsive Style Overhaul -->
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0c0f1d 0%, #030408 100%);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-body);
            color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            z-index: 10;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .store-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-ios {
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.05);
        }

        .btn-ios:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .btn-android {
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.05);
        }

        .btn-android:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .logo {
                width: 120px;
                height: 120px;
                border-radius: 26px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 0.88rem;
                margin-bottom: 24px;
            }

            .store-buttons {
                flex-direction: column;
                align-items: stretch;
                max-width: 260px;
                margin: 0 auto;
                gap: 12px;
            }

            .store-btn {
                padding: 12px 20px;
            }
        }
    </style>

    <!-- Auto-Redirect Logic based on Device OS with Bot/Crawler Safeguards -->
    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Detect popular bots & crawlers to prevent them from following the redirect
            var isBot = /bot|crawler|spider|whatsapp|facebookexternalhit|twitterbot|telegrambot|discordbot|slackbot|applebot|google/i.test(userAgent);
            
            if (isBot) {
                console.log("Crawler detected, staying on page to serve metadata previews.");
                return; 
            }

            // A clean 1.5s delay to allow secure headers crawling and premium transition UX
            setTimeout(function() {
                // iOS detection (App Store redirect)
                if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    window.location.href = "https://apps.apple.com/app/mindpilot"; 
                }
                // Android detection (Google Play Store redirect)
                else if (/android/i.test(userAgent)) {
                    window.location.href = "https://play.google.com/store/apps/details?id=com.mindpilot.app"; 
                }
                // Desktop fallback
                else {
                    window.location.href = "https://play.google.com/store/apps/details?id=com.mindpilot.app"; 
                }
            }, 1500);
        };
    </script>
</head>
<body>
    <div class="container">
        <img src="https://mindpilot-131f1.web.app/favicon.png" alt="MindPilot Logo" class="logo">
        <h2>Redirecting to App Store...</h2>
        <p class="subtitle">If you are not redirected automatically, please tap your store below:</p>
        <div class="store-buttons">
            <a href="https://apps.apple.com/app/mindpilot" class="store-btn btn-ios">App Store (iOS)</a>
            <a href="https://play.google.com/store/apps/details?id=com.mindpilot.app" class="store-btn btn-android">Google Play (Android)</a>
        </div>
    </div>
</body>
</html>
