    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection (App Store redirect)

            }
            // Android detection (Google Play Store redirect)
            else if (/android/i.test(userAgent)) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.mindpilot.app"; 
            }
            // Desktop fallback
            else {
                window.location.href = "https://play.google.com/store/apps/details?id=com.mindpilot.app"; 
            }
        };
