name: mindpilot
description: "A new Flutter project."

publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10
  flutter_screenutil: ^5.9.3
  animations: ^2.1.1
  intl_phone_field: ^3.1.5
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.1.2
  firebase_analytics: ^12.4.0
  firebase_crashlytics: ^5.2.2
  flutter_local_notifications: ^21.0.0
  audioplayers: ^6.1.1
  google_generative_ai: ^0.4.5
  flutter_markdown: ^0.7.3+2
  sqflite: ^2.4.1
  path: ^1.9.0
  app_settings: ^6.1.1
  timezone: ^0.11.0
  share_plus: ^11.1.0
  package_info_plus: ^8.2.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.1
  flutter_timezone: ^3.0.1
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  screenshot: ^3.0.0
  screen_protector: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/mindpilot_app.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
    - .env
