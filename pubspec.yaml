name: mindpilot
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_screenutil: ^5.9.3
  animations: ^2.1.1
  intl_phone_field: ^3.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets//icons/
    - assets//images/
